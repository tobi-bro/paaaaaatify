version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: paaaaaatify-db
    restart: always
    environment:
      POSTGRES_USER: paaaaaatify_user
      POSTGRES_PASSWORD: paaaaaatify_secure_password_2026
      POSTGRES_DB: paaaaaatify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paaaaaatify_user -d paaaaaatify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paaaaaatify-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paaaaaatify-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://paaaaaatify_user:paaaaaatify_secure_password_2026@db:5432/paaaaaatify
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=paaaaaatify_super_secret_jwt_key_2026_music_freedom
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/static:/app/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paaaaaatify-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:

