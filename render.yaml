services:
  # Paaaaaatify FastAPI Core Web Service
  - type: web
    name: paaaaaatify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 691672483080-tnadcremhnfqu9nsos0g3thimhhvvp5d.apps.googleusercontent.com
      - key: DATABASE_URL
        fromDatabase:
          name: paaaaaatify-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://paaaaaatify.com,https://api.paaaaaaatify.com,capacitor://localhost,http://localhost"
    plan: free

databases:
  # Managed PostgreSQL Database for Production
  - name: paaaaaatify-postgres
    databaseName: paaaaaatify
    user: paaaaaatify_admin
    plan: free

